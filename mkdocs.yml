site_name: SecurityBoat Documentation
site_description: Official SecurityBoat user guides for Clients, Researchers, and Program Operators.
site_url: https://docs.securityboat.in

docs_dir: docs
site_dir: site

theme:
  name: material
  language: en
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to light mode
  font:
    text: Geist
    code: Geist Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.instant
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html

nav:
  - Overview: index.md
  - TriNetra Platform:
      - Overview: trinetra/index.md
      - Bug Bounty: trinetra/bug-bounty.md
      - PTaaS: trinetra/ptaas.md
      - Agentic Pentest: trinetra/agentic-pentest.md
      - Attack Surface Management: trinetra/attack-surface-management.md
      - Digital Risk Protection: trinetra/digital-risk-protection.md
  - Client Guide:
